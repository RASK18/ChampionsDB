name: Actualizar datos de Champions
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: write
concurrency:
  group: champions-data-main
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      published-ref: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/objects
          key: champions-captures-${{ github.run_id }}
          restore-keys: champions-captures-
      - run: npm ci --omit=optional --ignore-scripts
      - run: npm test
      - run: npm run data:update
      - run: npm run data:validate
      - name: Verificar reconstrucción sin red
        run: |
          before=$(git diff -- data sources/snapshot.json | sha256sum)
          npm run data:rebuild
          after=$(git diff -- data sources/snapshot.json | sha256sum)
          test "$before" = "$after"
      - name: Commit solo de datos generados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data sources/snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while IFS= read -r file; do
            case "$file" in data/*|sources/snapshot.json) ;; *) exit 1 ;; esac
          done
          git commit -m 'data: actualizar catálogo verificado de Champions'
          git push origin HEAD:main
      - name: Identificar el commit publicado
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Capturas e informes para auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champions-evidence-${{ github.run_id }}
          include-hidden-files: true
          retention-days: 30
          path: |
            .cache/objects/
            sources/snapshot.json
            data/reports/
            artifacts/
  publish-site:
    needs: update
    uses: ./.github/workflows/site.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      ref: ${{ needs.update.outputs.published-ref }}
